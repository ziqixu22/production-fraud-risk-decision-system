[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-fraud-risk-decision-system"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "mlflow>=2.12",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
